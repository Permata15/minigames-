<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chatbot Saya</title>
  <style>
    :root {
      --bg: #f5f5f4; --panel: #ffffff; --text: #1c1917; --muted: #78716c;
      --user: #d97757; --user-text: #ffffff; --bot: #f0eeea; --border: #e7e5e4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1917; --panel: #292524; --text: #f5f5f4; --muted: #a8a29e;
        --user: #c96442; --user-text: #ffffff; --bot: #3a3532; --border: #44403c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      height: 100dvh; display: flex; flex-direction: column;
    }
    header {
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      background: var(--panel); display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { font-size: 18px; margin: 0; }
    header button {
      background: none; border: 1px solid var(--border); color: var(--muted);
      border-radius: 8px; padding: 6px 10px; cursor: pointer;
    }
    #chat {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
      max-width: 800px; width: 100%; margin: 0 auto;
    }
    .msg {
      max-width: 85%; padding: 10px 14px; border-radius: 14px;
      line-height: 1.5; white-space: pre-wrap; word-wrap: break-word;
    }
    .user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
    .assistant { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
    .empty { color: var(--muted); text-align: center; margin-top: 30vh; }
    form {
      display: flex; gap: 8px; padding: 12px 16px; background: var(--panel);
      border-top: 1px solid var(--border);
    }
    form > div { display: flex; gap: 8px; max-width: 800px; width: 100%; margin: 0 auto; }
    textarea {
      flex: 1; resize: none; padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      font: inherit; max-height: 160px;
    }
    form button {
      background: var(--user); color: var(--user-text); border: none;
      border-radius: 10px; padding: 0 18px; font: inherit; cursor: pointer;
    }
    form button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <header>
    <h1>🤖 Chatbot Saya</h1>
    <button id="reset" type="button">Chat baru</button>
  </header>

  <main id="chat"><p class="empty">Mulai ngobrol dengan mengetik pesan di bawah.</p></main>

  <form id="form">
    <div>
      <textarea id="input" rows="1" placeholder="Ketik pesan… (Enter untuk kirim, Shift+Enter baris baru)"></textarea>
      <button id="send" type="submit">Kirim</button>
    </div>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    let history = []; // [{role, content}]

    function addBubble(role, text) {
      chat.querySelector(".empty")?.remove();
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function sendMessage(text) {
      history.push({ role: "user", content: text });
      addBubble("user", text);
      const bubble = addBubble("assistant", "…");
      send.disabled = true;

      let reply = "";
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          reply += decoder.decode(value, { stream: true });
          bubble.textContent = reply;
          chat.scrollTop = chat.scrollHeight;
        }
      } catch (err) {
        reply += "\n\n[Gagal terhubung ke server.]";
        bubble.textContent = reply;
      }

      if (reply.trim()) history.push({ role: "assistant", content: reply });
      else history.pop(); // buang pesan user kalau tidak ada balasan
      send.disabled = false;
      input.focus();
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || send.disabled) return;
      input.value = "";
      input.style.height = "auto";
      sendMessage(text);
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = input.scrollHeight + "px";
    });

    document.getElementById("reset").addEventListener("click", () => {
      history = [];
      chat.innerHTML = '<p class="empty">Mulai ngobrol dengan mengetik pesan di bawah.</p>';
    });
  </script>
</body>
</html>
