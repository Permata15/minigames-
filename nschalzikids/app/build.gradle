plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nschalzi.kids'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nschalzi.kids'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Ditandatangani dengan kunci debug agar APK langsung bisa dipasang.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
