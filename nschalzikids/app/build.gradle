plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nschalzi.kids'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nschalzi.kids'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '2.1'
    }

    signingConfigs {
        nsk {
            // Kunci tetap supaya versi baru bisa menimpa versi lama di HP.
            storeFile file('../keystore/nschalzikids.jks')
            storePassword 'nschalzikids'
            keyAlias 'nschalzikids'
            keyPassword 'nschalzikids'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.nsk
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
