<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Nschalzikids</title>
<style>
  :root{--pink:#E8467C;--pink2:#FF8FB1;--bg:#FFE3EE;--ink:#3B2A3F}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"Comic Sans MS","Baloo 2",system-ui,sans-serif;background:var(--bg);color:var(--ink);
       background-image:radial-gradient(#ffd0e1 2px,transparent 2px);background-size:26px 26px}
  header{text-align:center;padding:22px 16px 8px}
  header svg{width:120px;height:120px;filter:drop-shadow(0 6px 10px rgba(232,70,124,.3));animation:bob 3s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
  h1{margin:6px 0 0;font-size:34px;color:var(--pink);letter-spacing:.5px;text-shadow:2px 2px 0 #fff}
  .sub{margin:2px 0 0;font-size:15px;opacity:.8}
  form{display:flex;gap:8px;max-width:560px;margin:16px auto 6px;padding:0 16px}
  input{flex:1;min-width:0;border:3px solid var(--pink2);border-radius:999px;padding:12px 18px;font-size:17px;font-family:inherit;outline:none;background:#fff}
  input:focus{border-color:var(--pink)}
  button{border:0;border-radius:999px;background:var(--pink);color:#fff;font-size:20px;padding:0 20px;font-family:inherit}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:560px;margin:14px auto 40px;padding:0 16px}
  .tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:118px;border-radius:24px;
        text-decoration:none;color:var(--ink);font-weight:bold;font-size:16px;text-align:center;padding:12px;
        box-shadow:0 5px 0 rgba(0,0,0,.12);transition:transform .1s}
  .tile:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
  .tile span{font-size:44px;line-height:1}
  .c1{background:#FFD3E2}.c2{background:#D7F5E5}.c3{background:#FFF1C2}.c4{background:#D8ECFF}
  .c5{background:#EBDDFF}.c6{background:#FFE0CC}
  footer{text-align:center;font-size:12px;opacity:.6;padding-bottom:28px}
</style>
</head>
<body>
<header>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">   <rect width="108" height="108" rx="24" fill="#FFE3EE"/>   <!-- bintang kecil -->   <path fill="#FFC93C" d="M84,24 l1.8,4 4.2,0.4 -3.2,2.8 1,4.2 -3.8,-2.2 -3.8,2.2 1,-4.2 -3.2,-2.8 4.2,-0.4z"/>   <path fill="#7FD3F7" d="M22,30 l1.2,2.6 2.8,0.3 -2.1,1.9 0.6,2.8 -2.5,-1.5 -2.5,1.5 0.6,-2.8 -2.1,-1.9 2.8,-0.3z"/>   <!-- kerudung: bahu -->   <path fill="#E8467C" d="M26,88 C26,70 38,63 54,63 C70,63 82,70 82,88 Z"/>   <!-- kerudung: kepala -->   <path fill="#E8467C" d="M31,50 a23,24 0 1,0 46,0 a23,24 0 1,0 -46,0"/>   <!-- lipatan dalam kerudung -->   <path fill="#FF8FB1" d="M37,53 a17,18 0 1,0 34,0 a17,18 0 1,0 -34,0"/>   <!-- wajah -->   <path fill="#FFDDB8" d="M40,54 a14,15 0 1,0 28,0 a14,15 0 1,0 -28,0"/>   <!-- mata -->   <path fill="#3B2A3F" d="M46.5,53 a2.4,2.8 0 1,0 4.8,0 a2.4,2.8 0 1,0 -4.8,0"/>   <path fill="#3B2A3F" d="M56.7,53 a2.4,2.8 0 1,0 4.8,0 a2.4,2.8 0 1,0 -4.8,0"/>   <path fill="#FFFFFF" d="M48.6,52 a0.9,0.9 0 1,0 1.8,0 a0.9,0.9 0 1,0 -1.8,0"/>   <path fill="#FFFFFF" d="M58.8,52 a0.9,0.9 0 1,0 1.8,0 a0.9,0.9 0 1,0 -1.8,0"/>   <!-- pipi -->   <path fill="#FF9AA8" d="M42.5,59 a2.6,1.8 0 1,0 5.2,0 a2.6,1.8 0 1,0 -5.2,0"/>   <path fill="#FF9AA8" d="M60.3,59 a2.6,1.8 0 1,0 5.2,0 a2.6,1.8 0 1,0 -5.2,0"/>   <!-- senyum -->   <path fill="none" stroke="#C2185B" stroke-width="1.8" stroke-linecap="round" d="M49.5,61 Q54,65 58.5,61"/>   <!-- bros bunga -->   <path fill="#FFC93C" d="M50.5,74 a3.5,3.5 0 1,0 7,0 a3.5,3.5 0 1,0 -7,0"/>   <path fill="#FFFFFF" d="M52.6,74 a1.4,1.4 0 1,0 2.8,0 a1.4,1.4 0 1,0 -2.8,0"/> </svg> 
  <h1>Nschalzikids</h1>
  <p class="sub">Nonton seru, belajar asyik, tanpa iklan ✨</p>
</header>

<form id="f">
  <input id="q" type="search" placeholder="Cari video..." autocomplete="off">
  <button aria-label="Cari">🔍</button>
</form>

<div class="grid" id="grid"></div>
<footer>Mode Terbatas aktif · Iklan diblokir</footer>

<script>
  var cats = [
    ["🎵","Lagu Anak","lagu anak indonesia"],
    ["🕌","Belajar Mengaji","belajar mengaji iqro anak"],
    ["🌙","Lagu Islami","lagu islami anak"],
    ["🤲","Doa Harian","doa sehari hari anak"],
    ["📖","Kisah Nabi","kisah nabi untuk anak"],
    ["🔤","Belajar Huruf","belajar huruf abjad anak"],
    ["🔢","Berhitung","belajar berhitung anak"],
    ["🎨","Mengenal Warna","belajar mengenal warna anak"],
    ["🐘","Dunia Hewan","mengenal hewan untuk anak"],
    ["🧚","Dongeng","dongeng anak bahasa indonesia"],
    ["🇬🇧","Bahasa Inggris","belajar bahasa inggris anak"],
    ["✂️","Prakarya","prakarya anak mudah"]
  ];
  function go(q){ location.href = "https://m.youtube.com/results?search_query=" + encodeURIComponent(q + " anak"); }
  var g = document.getElementById("grid");
  cats.forEach(function(c,i){
    var a = document.createElement("a");
    a.className = "tile c" + (i % 6 + 1);
    a.href = "https://m.youtube.com/results?search_query=" + encodeURIComponent(c[2]);
    a.innerHTML = "<span>" + c[0] + "</span>" + c[1];
    g.appendChild(a);
  });
  document.getElementById("f").onsubmit = function(e){
    e.preventDefault();
    var q = document.getElementById("q").value.trim();
    if (q) go(q);
  };
</script>
</body>
</html>
