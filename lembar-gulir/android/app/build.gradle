plugins {
    id 'com.android.application'
}

def buildNumber = (System.getenv('VERSION_CODE') ?: '1') as int

android {
    namespace 'com.lembargulir.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lembargulir.app'
        minSdk 24
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    // A fixed key so each new APK installs over the previous one.
    signingConfigs {
        stable {
            storeFile file('../lembar.keystore')
            storePassword 'lembargulir'
            keyAlias 'lembar'
            keyPassword 'lembargulir'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.stable
        }
        debug {
            signingConfig signingConfigs.stable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
