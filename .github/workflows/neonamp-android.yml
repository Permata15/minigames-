name: NeonAmp Android APK

on:
  push:
    paths:
      - "neonamp-android/**"
      - ".github/workflows/neonamp-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neonamp-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: NeonAmp-apk
          path: neonamp-android/app/build/outputs/apk/release/*.apk
