name: NeonAmp Android APK

on:
  push:
    paths:
      - "neonamp-android/**"
      - ".github/workflows/neonamp-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neonamp-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk NeonAmp.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NeonAmp-apk
          path: neonamp-android/NeonAmp.apk
      # Rilis publik: APK bisa diunduh langsung tanpa ekstrak zip.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: neonamp-latest
          name: NeonAmp (terbaru)
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            APK NeonAmp terbaru — unduh **NeonAmp.apk** di bawah lalu pasang di HP Android (8.0+).
            Build dari commit ${{ github.sha }}.
          files: neonamp-android/NeonAmp.apk
