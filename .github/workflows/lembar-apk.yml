name: Build Lembar Gulir APK

on:
  push:
    branches: ['ccr-d6cc0986-5h93xu', 'main']
    paths: ['lembar-gulir/**', '.github/workflows/lembar-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Put the web app inside the Android project
        run: |
          mkdir -p lembar-gulir/android/app/src/main/assets
          cp lembar-gulir/index.html lembar-gulir/android/app/src/main/assets/index.html

      - name: Build APK
        working-directory: lembar-gulir/android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp lembar-gulir/android/app/build/outputs/apk/release/app-release.apk LembarGulir-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LembarGulir-apk
          path: LembarGulir-v1.0.${{ github.run_number }}.apk

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lembar-gulir-v1.0.${{ github.run_number }}
          name: Lembar Gulir v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: LembarGulir-v1.0.${{ github.run_number }}.apk
          body: |
            APK Android untuk Lembar Gulir. Unduh file .apk di bawah, buka di HP, lalu izinkan pemasangan dari sumber ini.
