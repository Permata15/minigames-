name: YouTube download check
on:
  push:
    paths: ["tools/ytcheck/**", ".github/workflows/ytcheck.yml"]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tools/ytcheck } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew --no-daemon -q run
