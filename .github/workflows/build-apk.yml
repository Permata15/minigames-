name: Build Nschalzikids APK

on:
  push:
    paths:
      - 'nschalzikids/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nschalzikids
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Nschalzikids.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Nschalzikids-apk
          path: nschalzikids/Nschalzikids.apk
